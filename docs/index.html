<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#363542">
  <title>Celestefall — Web Port</title>
  <link rel="icon" href="assets/player-idle-0.png">
  <link rel="stylesheet" href="styles.css?v=20260830-three-screen">
</head>
<body>
  <main class="game-shell" aria-label="Celestefall web demo">
    <section class="stage-wrap">
      <canvas id="game" width="640" height="360" aria-label="Celestefall platforming demo" tabindex="0"></canvas>
      <div class="hud">
        <div class="brand">CELESTEFALL <span>WEB PORT</span></div>
        <div class="hud-actions">
          <button id="helpButton" class="icon-button" type="button" aria-label="Show controls">?</button>
          <button id="resetButton" class="icon-button" type="button" aria-label="Reset demo">↻</button>
        </div>
      </div>
      <section id="help" class="help-card" aria-live="polite">
        <strong>MOVE. JUMP. HOLD ON.</strong>
        <span>Arrows / WASD to move, look and duck · Space to jump · Shift to cling · Down + Jump to drop</span>
      </section>
    </section>

    <section class="touch-controls" aria-label="Touch game controls">
      <div id="joystick" class="joystick" aria-label="Movement joystick">
        <div class="joystick-ring"></div>
        <div id="joystickKnob" class="joystick-knob"></div>
      </div>
      <div class="touch-hint" aria-hidden="true">MOVE</div>
      <div class="action-cluster">
        <button id="grabButton" class="action-button grab" type="button"><span>GRAB</span><b>G</b></button>
        <button id="jumpButton" class="action-button jump" type="button"><span>JUMP</span><b>A</b></button>
      </div>
    </section>
  </main>
  <script src="game.js?v=20260830-three-screen"></script>
</body>
</html>
